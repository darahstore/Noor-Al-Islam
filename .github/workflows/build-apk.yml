name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android Environment
        uses: android-actions/setup-android@v3

      - name: Prepare Files & Install Capacitor with Live Server
        run: |
          mkdir -p www
          cp -r index.html styles.css app.js www/ 2>/dev/null || true
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "NoorAlIslam" "com.noor.islam" --web-dir "www"
          
          # ربط التطبيق بموقعك على GitHub Pages لتفعيل التحديث التلقائي الفوري
          node -e '
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync("capacitor.config.json"));
            config.server = { url: "https://darahstore.github.io/Noor-Al-Islam/", cleartext: true };
            fs.writeFileSync("capacitor.config.json", JSON.stringify(config, null, 2));
          '

          npx cap add android
          npx cap sync android

      - name: Add Android Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          PERMISSIONS='
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
            <uses-permission android:name="android.permission.VIBRATE" />
          '
          sed -i "/<\/manifest>/i $PERMISSIONS" $MANIFEST

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Al-Islam-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
